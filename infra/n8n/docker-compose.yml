services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
      # Consumed by the workflows in ./workflows/ — point at the running
      # FastAPI backend and match its N8N_WEBHOOK_SECRET.
      - SETU_API_BASE_URL=http://host.docker.internal:8000/api/v1
      - SETU_WEBHOOK_SECRET=
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows

volumes:
  n8n_data:
